version: 2

models:
  - name: daily_sports_inter
    description: "Intermediate model for daily sports data with deduplication"
    columns:
      - name: region_id
        description: "Region ID for the sports data"
      - name: region
        description: "Region name for the sports data"
      - name: event_id
        description: "Event ID for the sports data"
      - name: sport_key
        description: "Sport key for the sports data"
      - name: sport_title
        description: "Sport title for the sports data"
      - name: commence_time
        description: "Commence time for the sports event"
      - name: home_team
        description: "Home team for the sports event"
      - name: away_team
        description: "Away team for the sports event"
      - name: bookmaker_keys
        description: "Bookmakers offering odds for the sports event"
      - name: payload
        description: "Payload containing odds and other data for the sports event"
      - name: ingested_at
        description: "Timestamp when the data was ingested into the database"
  - name: regions_inter
    description: "Intermediate model for distinct regions from daily sports data"
    columns:
      - name: region_id
        description: "Region ID for the sports data"
      - name: region
        description: "Region name for the sports data"
  - name: odds_api_sports_inter
    description: "Intermediate model for sports data from the odds API"
    columns:
      - name: key
        description: "Key for the sports data"
      - name: group_name
        description: "Group name for the sports data"
      - name: title
        description: "Title for the sports data"
      - name: description
        description: "Description for the sports data"
      - name: active
        description: "Indicates if the sport is active in the odds API"
      - name: has_outrights
        description: "Indicates if the sport has outrights in the odds API"
  - name: sport
    description: "Intermediate model for sport data"
    columns:
      - name: sport_key
        description: "Sport key for the sports data"
      - name: sport_title
        description: "Sport title for the sports data"